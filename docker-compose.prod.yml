# docker-compose.prod.yml - the PRODUCTION stack founding.dev's Publish builds.
#
# founding.dev looks for prod compose files in this order:
#   docker-compose.prod.yml -> docker-compose.yml -> compose.yml -> compose.yaml
# so this file wins over anything else in the tree, which is what we want.
#
# THE WHOLE POINT: `build:`, not `image:`.
#
# Upstream publishes ghcr.io/zulip/zulip-server and docker-zulip's compose uses
# it. Deploying that would ship stock Zulip and silently discard every edit the
# customer made - no error, no warning. Dockerfile.prod builds the tree that was
# actually edited, and this file is what points production at it.
#
# Unlike the preview (one container, because Zulip's DEV tooling insists on local
# services), production runs the services separately, which is how docker-zulip
# and every real Zulip deployment are shaped.

services:
  database:
    # Zulip's own PostgreSQL image, not stock postgres. It carries the full-text
    # search extensions Zulip requires; swapping it gives an app that installs
    # cleanly and then fails on the first search.
    #
    # PINNED TO 14 BECAUSE THAT IS THE NEWEST TAG THAT EXISTS. The obvious
    # guess - matching the 16 in Dockerfile.prod - is a tag zulip has never
    # published: the repository has latest, 14, 13, 12, 11, 10, and `latest`
    # has not moved since 2024 while 14 is still updated. It must also match
    # --postgresql-version in Dockerfile.prod; upstream docker-zulip pairs 14
    # with this same image, which is the combination they actually test.
    #
    # Worth knowing how this fails, because the error names nothing useful:
    # Fly rejects the machine with "platform not found: linux/amd64", which
    # sounds like an architecture problem and is really "that image does not
    # exist". The publish builds and pushes perfectly first, so the failure
    # lands ~20 minutes in, after everything that looks like the hard part.
    image: zulip/zulip-postgresql:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zulip}
    volumes:
      # Customer data. Named so it survives a machine replacement - losing this
      # loses every message, user and upload.
      - zulip-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zulip"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    expose:
      - 5432

  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["-m", "128"]
    expose:
      - 11211

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: zulip
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-zulip}
    volumes:
      - zulip-rabbitmq:/var/lib/rabbitmq
    expose:
      - 5672

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - zulip-redis:/data
    expose:
      - 6379

  zulip:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Rewritten by the platform to the app's real public URL at publish time.
      # Not cosmetic: Zulip builds absolute URLs from this server-side, so a wrong
      # value gives an app that renders and then fails every asset and API call -
      # it looks like a broken deploy rather than a config error.
      # FDEV_PUBLIC_HOST is the app's real public hostname, passed by the control
      # plane (it is the only thing that knows the customer's subdomain). Zulip
      # validates the incoming Host header against this and builds every absolute
      # link from it, so the fly.dev name would not do: customers arrive on the
      # subdomain and would get links pointing somewhere they are not.
      #
      # The fallback is .localdomain rather than plain localhost because Zulip
      # refuses to start without a domain part - "EXTERNAL_HOST (localhost) does
      # not contain a domain part" - so a bare localhost is a crash, not a
      # degraded local default.
      SETTING_EXTERNAL_HOST: ${SETTING_EXTERNAL_HOST:-${FDEV_PUBLIC_HOST:-localhost.localdomain}}
      SETTING_ZULIP_ADMINISTRATOR: ${SETTING_ZULIP_ADMINISTRATOR:-support@founding.dev}
      # The 12.x names. The entrypoint vendored in founding/docker/ is from
      # docker-zulip 12.x, which RENAMED these and refuses to start on the old
      # ones rather than translating them:
      #
      #   DB_HOST -> SETTING_REMOTE_POSTGRES_HOST
      #   DB_HOST_PORT -> SETTING_REMOTE_POSTGRES_PORT
      #   DB_USER -> CONFIG_postgresql__database_user
      #   DISABLE_HTTPS / SSL_CERTIFICATE_GENERATION -> CERTIFICATES
      #
      # It exits immediately, and `docker compose up --wait` reports only
      # "container app-zulip-1 is unhealthy" while swallowing the container's own
      # output, so the machine restart-loops with the reason invisible.
      SETTING_REMOTE_POSTGRES_HOST: database
      SETTING_REMOTE_POSTGRES_PORT: "5432"
      CONFIG_postgresql__database_user: zulip
      SECRETS_postgres_password: ${POSTGRES_PASSWORD:-zulip}
      SETTING_MEMCACHED_LOCATION: memcached:11211
      SETTING_RABBITMQ_HOST: rabbitmq
      SECRETS_rabbitmq_password: ${RABBITMQ_PASSWORD:-zulip}
      SETTING_REDIS_HOST: redis
      SECRETS_secret_key: ${ZULIP_SECRET_KEY:-changemechangemechangemechangeme}
      # Zulip refuses to start without an email backend configured; the console
      # backend keeps a fresh deployment working before the customer has any SMTP
      # credentials, instead of failing the first boot on something they have not
      # been asked for yet.
      SETTING_EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      # EMPTY means "serve plain HTTP, install no certificates" - the entrypoint
      # sets nginx http_only for exactly this case. Correct here because Fly's
      # proxy terminates TLS in front of the machine and forwards to port 80;
      # a self-signed certificate inside would be pointless and would make the
      # health check fail against its own untrusted cert.
      CERTIFICATES: ""
    # DECLARED EXPLICITLY, with a start period measured against what Zulip
    # actually does on a first boot: create the database, run every migration and
    # build the initial realm. That is minutes, not seconds.
    #
    # The image carries its own HEALTHCHECK with a 300s start period, but relying
    # on it is fragile - the platform re-derives container checks from THIS file
    # and falls back to a few seconds when a service declares none. The result is
    # a container killed ~48s in, reported only as "container app-zulip-1 is
    # unhealthy", while the app was still correctly migrating. Every other
    # service here reaches Healthy in seconds, which makes this one look broken
    # when it is merely slow.
    #
    # retries x interval after the start period gives another 5 minutes before a
    # genuinely stuck boot is declared dead, so a real failure still surfaces.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    volumes:
      # Uploads, avatars and generated assets. Customer data.
      - zulip-data:/data
    ports:
      - "80:80"

volumes:
  zulip-database:
  zulip-rabbitmq:
  zulip-redis:
  zulip-data:
