# docker-compose.yml - the EDITABLE stack founding.dev boots on import.
#
# NAMED docker-compose.yml, not docker-compose.preview.yml, and that is load
# bearing. The platform looks for a primary compose file FIRST; a repo that ships
# only a preview compose reads as "no compose at all" and gets routed into
# auto-dockerize, which then generates a second, wrong compose and stalls. The
# preview-compose opt-in exists for repos that already have their own
# docker-compose.yml for local dev and need a different one in the cloud - which
# upstream Zulip does not, so there is nothing here to opt out of.
#
# ONE container, deliberately. Zulip's dev environment runs PostgreSQL, Redis,
# RabbitMQ and memcached locally and its database tooling assumes it (it connects
# to localhost and builds template databases there). Splitting them out was tried
# and failed on a real machine; see the header of Dockerfile.preview.
#
# The source is bind-mounted so the agent's edits are live and run-dev reloads
# them. The expensive directories are named volumes so the bind mount cannot
# shadow what the image baked - without them the container starts with an empty
# venv and run-dev dies on its first import.
services:
  zulip:
    # `image:`, never `build:`. CI already built this, and the platform injects
    # PREVIEW_IMAGE from the descriptor's previewImage (startup.sh reads it and
    # re-pulls when the tag changes). A `build:` here would put Zulip's ~5 minute
    # provision back on the customer's machine on every single import, which is
    # the entire thing the prebuilt image exists to avoid.
    #
    # The local default is only for `docker compose up` on a laptop after
    # building Dockerfile.preview by hand.
    image: ${PREVIEW_IMAGE:-zulip-preview:local}
    restart: unless-stopped
    # Run the entrypoint from the BIND-MOUNTED repo, not the image's baked copy
    # at /home/zulip/fdev-preview-entrypoint.sh. Two reasons: boot behaviour then
    # travels with the source the customer owns and the agent can edit, and a fix
    # to it ships by pushing the template rather than by rebuilding and
    # re-tagging the preview image. The Dockerfile's CMD stays as the fallback
    # for a plain `docker run` with no compose.
    command: ["/home/zulip/zulip/tools/fdev-preview-entrypoint.sh"]
    environment:
      # run-dev builds absolute URLs from this; rewritten by the platform to the
      # preview's real hostname. The default only makes sense on a laptop.
      # Left EMPTY on purpose - the entrypoint derives it from FLY_APP_NAME.
      # See tools/fdev-preview-entrypoint.sh for why it is not defaulted here.
      EXTERNAL_HOST: ${EXTERNAL_HOST:-}
      FLY_APP_NAME: ${FLY_APP_NAME:-}
      FDEV_STATE_DIR: /srv/zulip-state
    volumes:
      - .:/home/zulip/zulip
      - zulip-preview-venv:/home/zulip/zulip/.venv
      - zulip-preview-node-modules:/home/zulip/zulip/node_modules
      # Customer data: the databases themselves, and the first-boot marker.
      - zulip-preview-pgdata:/var/lib/postgresql
      - zulip-preview-state:/srv/zulip-state
    ports:
      - "9991:9991"

volumes:
  zulip-preview-venv:
  zulip-preview-node-modules:
  zulip-preview-pgdata:
  zulip-preview-state:
